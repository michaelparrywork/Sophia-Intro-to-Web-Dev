<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star Bakery | Contact</title>
</head>
<body>
    <header>
        <img src="media/Bakery_c/bakery-logo_c.png" alt="North Star Bakery Logo"
            width="640"
            height="360">
        <nav aria-label="Main">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

<main>
    <h1>Contact Us</h1>

    <form action="#" method="post">
        <fieldset>
            <legend>Your Contact Information</legend>
            <p>
                <label for="contactName">Name:</label><br>
                <input type="text" id="contactName" name="contactName" required>
            </p>
            <p>
                <label for="contactEmail">Email:</label><br>
                <input type="email" id="contactEmail" name="contactEmail" required>
            </p>
            <p>
                <label for="contactPhone">Phone (optional):</label><br>
                <input type="tel" id="contactPhone" name="contactPhone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="111-111-1111">
            </p>
        </fieldset>

        <fieldset>
            <legend>Preorder or Inquiry Details</legend>
            <p>
                <label for="requestType">Preorder or General Inquiry?:</label><br>
                <select id="requestType" name="requestType" required>
                    <option value="preorder">Preorder</option>
                    <option value="generalInquiry">General Inquiry</option>
                </select>
            </p>
            <p>
                <label for="pickupDate">Pickup Date:</label><br>
                <select id="pickupDate" name="pickupDate">
                    <option value="today">Today</option>
                    <option value="tomorrow">Tomorrow</option>
                    <option value="futureDate">Future Date</option>
                </select>
            </p>
            <p>
                <label for="itemDetails">What item are you inquiring about?:</label><br>
                <select id="itemDetails" name="itemDetails">
                    <option value="cookies">Cookies</option>
                    <option value="cakes">Cakes</option>
                    <option value="pastries">Pastries</option>
                    <option value="breakfast">Breakfast</option>
                    <option value="bread">Signature Artisan Bread</option>
                </select>
            </p>
            <p>
                <label for="allergy">Please list any allergies:</label><br>
                <input type="text" id="allergy" name="allergy" placeholder="None">
            </p>
            <p>
                <button type="submit">Submit</button>
            </p>
        </fieldset>
    </form>

    <section>
        <h2>Hours & Location</h2>
        <p>Hours: 6:00 AM - 5:00 PM</p>
        <p>Location: 123 Bakery Street</p>
    </section>
</main>

<footer>
    <p>2026 North Star Bakery. 111-111-1111 All rights reserved.</p>
</footer>

</body>
</html>
